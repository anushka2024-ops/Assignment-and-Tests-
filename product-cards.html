<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f5f0eb;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #888;
    --accent: #c84b31;
    --tag-bg: #f0ebe5;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-hover: 0 16px 48px rgba(0,0,0,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 48px 24px 32px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    letter-spacing: -1px;
    color: var(--text);
  }
  header p { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }

  #loading {
    text-align: center;
    padding: 80px;
    font-size: 1.1rem;
    color: var(--muted);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #ddd;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #cards-container {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 0 32px 64px;
    justify-content: center;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    width: 260px;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: var(--shadow-hover);
  }

  .card-img-wrap {
    position: relative;
    height: 200px;
    overflow: hidden;
    background: var(--tag-bg);
  }
  .card-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .card:hover .card-img-wrap img { transform: scale(1.08); }

  .category-badge {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
    color: var(--text);
  }

  .card-body {
    padding: 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    line-height: 1.3;
    color: var(--text);
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid #f0ebe5;
  }

  .price {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .rating {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .stars { color: #f5a623; font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>Product Showcase</h1>
  <p>Discover our curated collection</p>
</header>

<div id="loading">
  <div class="spinner"></div>
  Fetching products…
</div>

<div id="cards-container"></div>

<script>
  function getStars(rating) {
    const full = Math.round(rating);
    return '★'.repeat(full) + '☆'.repeat(5 - full);
  }

  async function fetchProducts() {
    try {
      const res = await fetch('https://dummyjson.com/products?limit=30');
      const data = await res.json();
      return data.products;
    } catch (e) {
      document.getElementById('loading').textContent = 'Failed to load products.';
      return [];
    }
  }

  function renderCards(products) {
    const container = document.getElementById('cards-container');
    document.getElementById('loading').style.display = 'none';

    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${p.thumbnail}" alt="${p.title}" loading="lazy"/>
          <span class="category-badge">${p.category}</span>
        </div>
        <div class="card-body">
          <div class="brand">${p.brand || p.title}</div>
          <div class="rating">
            <span class="stars">${getStars(p.rating)}</span>
            <span>${p.rating.toFixed(2)}</span>
          </div>
          <div class="meta-row">
            <div class="price">$${p.price.toFixed(2)}</div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  fetchProducts().then(renderCards);
</script>
</body>
</html>
